# XPGet Configuration
# How many experience points are required to create one experience bottle.
# The value is specified in experience points, not levels.
exp-per-bottle: 7

gui:
  size: 27
  title: "<gold>Experience Conversion</gold>"

  divider:
    enabled: true
    material: "GRAY_STAINED_GLASS_PANE"
    name: "<gray>"

  close:
    slot: 22
    material: "BARRIER"
    name: "<red>Close"
    actions:
      - "[close]"

  # Available actions for GUI items:
  # [close]         - Close the inventory.
  # [cmd] <command> - Execute a command as the player.
  #
  # Available placeholders for conversion items:
  # {level}          - The player's current level.
  # {level_after}    - The player's level after conversion.
  # {levels}         - The difference between the current level and the level after conversion.
  # {level_required} - The level corresponding to the specified amount of experience points,
  #                    assuming the player starts with zero experience.
  # {exp}            - The total number of experience points required for conversion.
  # {current_exp}    - The player's current total experience points.
  # {max_bottles}    - The number of bottles selected for conversion.
  #
  # Important: experience points and levels are different quantities.
  # The number of levels lost depends on the player's current level
  # and their progress toward the next level.
  #
  # Example of a custom item:
  # main-menu:
  #   slot: 0
  #   material: "STONE"
  #   name: "<yellow>Main Menu"
  #   lore:
  #     - "<gray>Click to return to the main menu"
  #   actions:
  #     - "[close]"
  #     - "[cmd] menu"

  items:
    one:
      slot: 11
      material: "EXPERIENCE_BOTTLE"
      amount: 1
      name: "<green>1 Experience Bottle"
      lore:
        - "<gray>Quantity: <white>1 bottle"
        - "<gray>Cost: <white>{exp} XP"
        - "<gray>You have: <green>{current_exp} XP"
        - "<gray>After conversion: <yellow>Lv. {level_after} <dark_gray>(-{levels})"
        - ""
        - "<yellow>▶ Click to convert"

    stack:
      slot: 13
      material: "EXPERIENCE_BOTTLE"
      amount: 64
      name: "<yellow>64 Experience Bottles"
      lore:
        - "<gray>Quantity: <white>64 bottles"
        - "<gray>Cost: <white>{exp} XP"
        - "<gray>You have: <green>{current_exp} XP"
        - "<gray>After conversion: <yellow>Lv. {level_after} <dark_gray>(-{levels})"
        - ""
        - "<yellow>▶ Click to convert"

    max:
      slot: 15
      material: "ENCHANTED_BOOK"
      amount: 1
      name: "<gold>Maximum"
      lore:
        - "<gray>Quantity: <white>{max_bottles} bottles"
        - "<gray>Cost: <white>{exp} XP"
        - "<gray>You have: <green>{current_exp} XP"
        - "<gray>After conversion: <yellow>Lv. {level_after} <dark_gray>(-{levels})"
        - ""
        - "<yellow>▶ Click to convert"

messages:
  player-only: "<red>This command can only be used by players!"
  no-permission: "<red>You don't have permission to use this command!"

  usage: |
    <gold>Usage:
    <yellow>/xpget [amount|max]
    <gold>Examples:
    <yellow>/xpget 10 <gray>- convert experience into 10 bottles
    <yellow>/xpget max <gray>- convert the maximum possible number of bottles
    <gold>Note: You can convert any number of bottles.

  config-reloaded: "<green>Configuration reloaded successfully!"

  invalid-amount: "<red>Invalid amount! Specify a positive number or 'max'."

  not-enough-exp: "<red>Not enough experience! Required: <yellow>{level_required}</yellow> levels of experience. Your current level: <yellow>{level}</yellow>."
  not-enough-empty: "<red>Not enough empty bottles! Required: <yellow>{needed}</yellow>, you have: <yellow>{current}</yellow>."
  not-enough-space: "<red>Not enough inventory space! You can fit <yellow>{available}</yellow> more bottles."

  no-empty-bottles: "<red>You don't have any empty bottles!"
  not-enough-exp-for-one: "<red>You don't have enough experience for even one bottle!"
  not-enough-space-even: "<red>Not enough inventory space to store experience bottles!"

  success-specific: "<green>Successfully created <yellow>{amount}</yellow> experience bottles!"
  success-max: "<green>Successfully created <yellow>{actual}</yellow> experience bottles!"
