name: ${name}
version: ${version}
main: ${group}.XpGetPlugin
api-version: 1.21
author: FlyAwayMaking
website: https://github.com/flyawaymaking
description: Конвертация опыта в бутылочки опыта

commands:
  xpget:
    description: Convert experience into bottles of experience
    usage: /<command> [amount/max/reload]
    permission-message: "<red>You don't have permission to use this command!"

permissions:
  xpget.use:
    description: Allows using the /xpget command
    default: true
  xpget.reload:
    description: Allows reloading the plugin configuration
    default: op
